# sr.ht continuous-integration build for gbbopen-with-bordeaux-threads
# — amd64 (x86_64) variant.
#
# sr.ht's public builders are x86_64-only (verified against the
# compatibility matrix at https://man.sr.ht/builds.sr.ht/
# compatibility.md — only the amd64 row has the green checkmark
# across every image family). ARM64 coverage is therefore handled
# on GitHub Actions side; see .github/workflows/aarch64.yml.
#
# Runs on every push. Installs SBCL + CCL + ECL + Quicklisp +
# Ultralisp (the bt2 API lives in master snapshots that Ultralisp
# tracks; stock Quicklisp's bordeaux-threads is the older 0.9.x line,
# which doesn't expose the :bordeaux-threads-2 package the shim
# requires). CCL comes from the upstream Clozure release tarball
# rather than the system package manager so we pin to a known
# version (1.13). Then:
#
#   1. Symlinks the cloned repo into ~/quicklisp/local-projects/ so
#      the shim system is quickloadable.
#   2. Smoke-tests (ql:quickload :gbbopen-with-bordeaux-threads)
#      under SBCL to prove the .asd wiring works end-to-end.
#   3. Runs the shim's FiveAM suite under every Lisp on PATH
#      (SBCL + CCL + ECL) via run-tests.sh.
#   4. Runs the GBBopen module tests (run-gbbopen-tests.sh) under
#      SBCL + CCL. ECL is excluded because GBBopen itself doesn't
#      build on ECL yet — separate work item.
#   5. Runs the GBBopen tutorial under SBCL (run-tutorial.sh
#      defaults to SBCL-only for the same reason).
#
# Uploads the fresh tutorial-output artifact so build history at
# builds.sr.ht keeps a per-build copy for inspection. The committed
# artifacts/tutorial-output-sbcl.txt in git is the hand-curated
# canonical reference; the CI-uploaded one is a transient build
# artifact.

image: archlinux
packages:
  - sbcl
  - ecl
  - curl
  - openssh
  - git
sources:
  - https://git.sr.ht/~kevin_griffin/gbbopen-with-bordeaux-threads
environment:
  QUICKLISP_SETUP: /home/build/quicklisp/setup.lisp
  GITHUB_MIRROR: git@github.com:KevinGriffin-new/gbbopen-with-bordeaux-threads.git
# SSH private key "build-farm" for pushing the green-on-sr.ht state
# to the GitHub mirror — see the push_to_github task at the bottom
# of this file. Registered at https://builds.sr.ht/secrets.
secrets:
  - a5db22eb-d8a8-4c00-bf65-b16b903f3d4d
tasks:
  - install_quicklisp: |
      curl -fsSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
      sbcl --non-interactive --no-userinit --no-sysinit \
           --load /tmp/quicklisp.lisp \
           --eval '(quicklisp-quickstart:install)' \
           --eval '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)' \
           --eval '(ql:quickload :bordeaux-threads :silent t)' \
           --eval "(format t \"~&;;; bordeaux-threads version: ~a~%\" (asdf:component-version (asdf:find-system :bordeaux-threads)))" \
           --eval "(format t \"~&;;; :bordeaux-threads-2 present: ~a~%\" (and (find-package :bordeaux-threads-2) t))"

  # Install CCL 1.13 from the Clozure GitHub release. We pin to the
  # tarball instead of using a system package (Arch's `ccl` is in AUR,
  # not the official repos, so it would be a second-class dependency
  # on sr.ht's clean image). The tarball ships scripts/ccl64 with a
  # /usr/local/src/ccl default — we bypass that by passing CCL_BIN
  # pointing at the kernel directly; run-tests.sh's _ccl_env helper
  # detects the adjacent .image and sets CCL_DEFAULT_DIRECTORY itself.
  - install_ccl: |
      curl -fsSL -o /tmp/ccl.tar.gz \
        https://github.com/Clozure/ccl/releases/download/v1.13/ccl-1.13-linuxx86.tar.gz
      sudo tar -C /usr/local -xzf /tmp/ccl.tar.gz
      ls -la /usr/local/ccl/lx86cl64 /usr/local/ccl/lx86cl64.image
      echo "--- CCL version ---"
      CCL_DEFAULT_DIRECTORY=/usr/local/ccl /usr/local/ccl/lx86cl64 \
        --no-init --batch --quiet \
        -e '(progn (princ (lisp-implementation-version)) (terpri) (ccl:quit))'

  - setup_local_projects: |
      ln -sf "$HOME/gbbopen-with-bordeaux-threads" \
             "$HOME/quicklisp/local-projects/gbbopen-with-bordeaux-threads"
      sbcl --non-interactive --no-userinit --no-sysinit \
           --eval "(load \"$QUICKLISP_SETUP\")" \
           --eval '(ql:register-local-projects)'

  - smoke_quickload: |
      cd "$HOME/gbbopen-with-bordeaux-threads"
      sbcl --non-interactive --no-userinit --no-sysinit \
           --eval "(load \"$QUICKLISP_SETUP\")" \
           --eval '(ql:quickload :gbbopen-with-bordeaux-threads :silent t)' \
           --eval "(format t \"~&;;; (find-package :gbbopen) = ~a~%\" (and (find-package :gbbopen) t))" \
           --eval "(format t \"~&;;; (find-package :portable-threads) = ~a~%\" (and (find-package :portable-threads) t))" \
           --eval "(format t \"~&;;; shim version = ~a~%\" (symbol-value (find-symbol \"PORTABLE-THREADS-IMPLEMENTATION-VERSION\" :portable-threads)))"

  - shim_tests: |
      cd "$HOME/gbbopen-with-bordeaux-threads"
      IMPLS="sbcl ccl ecl" \
        CCL_BIN=/usr/local/ccl/lx86cl64 \
        ./run-tests.sh

  # Per-build XDG_CACHE_HOME isolates CCL's FASL cache (ASDF's cache
  # key collapses post-release CCL 1.13 builds onto the same dir as
  # release 1.13 — see investigation notes from 2026-05-26).
  - gbbopen_tests: |
      cd "$HOME/gbbopen-with-bordeaux-threads"
      IMPLS="sbcl ccl" \
        CCL_BIN=/usr/local/ccl/lx86cl64 \
        XDG_CACHE_HOME="$HOME/.cache-ccl-amd64" \
        ./run-gbbopen-tests.sh

  - tutorial: |
      cd "$HOME/gbbopen-with-bordeaux-threads"
      ./run-tutorial.sh

  # Mirror the just-tested commit to the GitHub aarch64-CI target.
  # Runs LAST so it only fires after every preceding test task has
  # exited zero — the GitHub repo therefore only ever contains
  # commits that are green on the sr.ht amd64 side. The SSH key
  # secret (see top of file) was registered at builds.sr.ht/secrets
  # and is installed into ~/.ssh/ by sr.ht before this task runs.
  - push_to_github: |
      set -eu
      cd "$HOME/gbbopen-with-bordeaux-threads"
      # NOTE: no branch-equality check here. sr.ht checks out the
      # pushed commit in detached-HEAD state, so `git rev-parse
      # --abbrev-ref HEAD` would return literal "HEAD", not "master".
      # We rely on sr.ht only triggering builds for commits actually
      # pushed to the repo and unconditionally push HEAD → github:master.

      # Pre-trust github.com so the push doesn't hang on host-key prompt.
      mkdir -p "$HOME/.ssh"
      ssh-keyscan -t ed25519,rsa github.com 2>/dev/null >> "$HOME/.ssh/known_hosts"

      # sr.ht installs an SSH-key-type secret at ~/.ssh/<UUID> and
      # creates an ~/.ssh/id_rsa symlink pointing at it (verified by
      # the diagnostic in job #1768528). The name you give the secret
      # at registration time ("build-farm") is just a UI label, not
      # the install path. So the standard ssh default-identity search
      # finds the key without any extra config — we only need to
      # confirm the symlink is there as a sanity check.
      if [ ! -e "$HOME/.ssh/id_rsa" ]; then
        echo "ERROR: ~/.ssh/id_rsa missing — sr.ht did not install the SSH-key secret"
        echo "       a5db22eb-d8a8-4c00-bf65-b16b903f3d4d. Contents of ~/.ssh/:"
        ls -la "$HOME/.ssh/" || true
        exit 1
      fi

      git remote add github "$GITHUB_MIRROR" 2>/dev/null || \
        git remote set-url github "$GITHUB_MIRROR"

      # Push the just-tested commit to master on the mirror. ssh
      # picks up ~/.ssh/id_rsa from its default search path. Use the
      # fully-qualified refname (refs/heads/master, not just master)
      # because an empty target repo has no existing refs to
      # disambiguate against — git #1768531's first push failed with
      # "The destination you provided is not a full refname". After
      # the first successful push creates refs/heads/master remotely,
      # subsequent pushes can use either form; the qualified form
      # works for both first-push and steady-state, so use it always.
      git push github HEAD:refs/heads/master

artifacts:
  - gbbopen-with-bordeaux-threads/artifacts/tutorial-output-sbcl.txt
  - gbbopen-with-bordeaux-threads/artifacts/gbbopen-tests-sbcl.txt
  - gbbopen-with-bordeaux-threads/artifacts/gbbopen-tests-ccl.txt
