# sr.ht continuous-integration build for gbbopen-with-bordeaux-threads
# — amd64 (x86_64) variant.
#
# sr.ht's public builders are x86_64-only (verified against the
# compatibility matrix at https://man.sr.ht/builds.sr.ht/
# compatibility.md — only the amd64 row has the green checkmark
# across every image family). ARM64 coverage is therefore handled
# on GitHub Actions side; see .github/workflows/aarch64.yml.
#
# Runs on every push. Installs SBCL + ECL + Quicklisp + Ultralisp
# (the bt2 API lives in master snapshots that Ultralisp tracks; stock
# Quicklisp's bordeaux-threads is the older 0.9.x line, which doesn't
# expose the :bordeaux-threads-2 package the shim requires). Then:
#
#   1. Symlinks the cloned repo into ~/quicklisp/local-projects/ so
#      the shim system is quickloadable.
#   2. Smoke-tests (ql:quickload :gbbopen-with-bordeaux-threads)
#      under SBCL to prove the .asd wiring works end-to-end.
#   3. Runs the shim's FiveAM suite under every Lisp on PATH
#      (currently SBCL + ECL) via run-tests.sh.
#   4. Runs the GBBopen tutorial under SBCL (run-tutorial.sh
#      defaults to SBCL-only because GBBopen-on-ECL is a separate
#      unverified work item).
#
# Uploads the fresh tutorial-output artifact so build history at
# builds.sr.ht keeps a per-build copy for inspection. The committed
# artifacts/tutorial-output-sbcl.txt in git is the hand-curated
# canonical reference; the CI-uploaded one is a transient build
# artifact.

image: archlinux
packages:
  - sbcl
  - ecl
  - curl
  - openssh
  - git
sources:
  - https://git.sr.ht/~kevin_griffin/gbbopen-with-bordeaux-threads
environment:
  QUICKLISP_SETUP: /home/build/quicklisp/setup.lisp
  GITHUB_MIRROR: git@github.com:KevinGriffin-new/gbbopen-with-bordeaux-threads.git
# SSH private key for pushing the green-on-sr.ht state to the GitHub
# mirror — see the push_to_github task at the bottom of this file.
# Registered at https://builds.sr.ht/secrets.
secrets:
  - 46f739e5-4538-45dd-a79f-bf173b7a2ed9
tasks:
  - install_quicklisp: |
      curl -fsSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
      sbcl --non-interactive --no-userinit --no-sysinit \
           --load /tmp/quicklisp.lisp \
           --eval '(quicklisp-quickstart:install)' \
           --eval '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)' \
           --eval '(ql:quickload :bordeaux-threads :silent t)' \
           --eval "(format t \"~&;;; bordeaux-threads version: ~a~%\" (asdf:component-version (asdf:find-system :bordeaux-threads)))" \
           --eval "(format t \"~&;;; :bordeaux-threads-2 present: ~a~%\" (and (find-package :bordeaux-threads-2) t))"

  - setup_local_projects: |
      ln -sf "$HOME/gbbopen-with-bordeaux-threads" \
             "$HOME/quicklisp/local-projects/gbbopen-with-bordeaux-threads"
      sbcl --non-interactive --no-userinit --no-sysinit \
           --eval "(load \"$QUICKLISP_SETUP\")" \
           --eval '(ql:register-local-projects)'

  - smoke_quickload: |
      cd "$HOME/gbbopen-with-bordeaux-threads"
      sbcl --non-interactive --no-userinit --no-sysinit \
           --eval "(load \"$QUICKLISP_SETUP\")" \
           --eval '(ql:quickload :gbbopen-with-bordeaux-threads :silent t)' \
           --eval "(format t \"~&;;; (find-package :gbbopen) = ~a~%\" (and (find-package :gbbopen) t))" \
           --eval "(format t \"~&;;; (find-package :portable-threads) = ~a~%\" (and (find-package :portable-threads) t))" \
           --eval "(format t \"~&;;; shim version = ~a~%\" (symbol-value (find-symbol \"PORTABLE-THREADS-IMPLEMENTATION-VERSION\" :portable-threads)))"

  - shim_tests: |
      cd "$HOME/gbbopen-with-bordeaux-threads"
      ./run-tests.sh

  - tutorial: |
      cd "$HOME/gbbopen-with-bordeaux-threads"
      ./run-tutorial.sh

  # Mirror the just-tested commit to the GitHub aarch64-CI target.
  # Runs LAST so it only fires after every preceding test task has
  # exited zero — the GitHub repo therefore only ever contains
  # commits that are green on the sr.ht amd64 side. The SSH key
  # secret (see top of file) was registered at builds.sr.ht/secrets
  # and is installed into ~/.ssh/ by sr.ht before this task runs.
  - push_to_github: |
      set -eu
      cd "$HOME/gbbopen-with-bordeaux-threads"
      # NOTE: no branch-equality check here. sr.ht checks out the
      # pushed commit in detached-HEAD state, so `git rev-parse
      # --abbrev-ref HEAD` would return literal "HEAD", not "master",
      # and a naive `[ "$branch" = master ]` guard would silently
      # skip the push. We rely instead on sr.ht only triggering this
      # build when a commit is actually pushed to the repo's master,
      # and unconditionally push HEAD → github:master.
      # Pre-trust github.com to avoid the interactive host-key prompt.
      mkdir -p "$HOME/.ssh"
      ssh-keyscan -t ed25519,rsa github.com 2>/dev/null >> "$HOME/.ssh/known_hosts"
      # sr.ht installs the secret into ~/.ssh/ at the filename the
      # secret was registered with. The chmod glob handles whichever
      # filename was used (id_ed25519, id_rsa, etc.).
      chmod 600 "$HOME/.ssh/"id_* 2>/dev/null || true
      git remote add github "$GITHUB_MIRROR" 2>/dev/null || \
        git remote set-url github "$GITHUB_MIRROR"
      # Push the just-tested commit to master on the mirror.
      git push github HEAD:master

artifacts:
  - gbbopen-with-bordeaux-threads/artifacts/tutorial-output-sbcl.txt
